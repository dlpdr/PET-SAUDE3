name: Validate project

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pet_saude
          POSTGRES_USER: pet_saude
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pet_saude"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_NAME: pet_saude
      DB_USER: pet_saude
      DB_PASSWORD: test-only-password
      DB_HOST: localhost
      DB_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py makemigrations --check --dry-run --settings=pet_saude_backend.test_settings
      - run: python manage.py test --settings=pet_saude_backend.test_settings
      - run: python manage.py test --settings=pet_saude_backend.test_settings
        env:
          TEST_USE_POSTGRES: 'True'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
