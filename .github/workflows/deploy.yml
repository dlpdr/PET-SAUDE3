name: Deploy Backend to Render

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (optional)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deploy hook..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "Warning: Deploy hook trigger failed."
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured. Render will auto-deploy via GitHub integration."
          fi
